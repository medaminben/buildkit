# Reusable CodeQL workflow for buildkit based products (C++, manual build).
#
# Caller example:
#   jobs:
#     codeql:
#       uses: medaminben/buildkit/.github/workflows/codeql.yml@v2.0.0
#       permissions:
#         security-events: write
#         actions: read
#         contents: read
#       with:
#         preset: default
#         apt-packages: "libfoo-dev"
#         configure-args: "-DMY_OPTION=ON"
#
# Buildkit is checked out at buildkit-ref into .buildkit and exported as
# BUILDKIT_DIR for the configure (the same buildkit as ci.yml uses).
# Private repositories need code scanning enabled.
name: CodeQL (reusable)

on:
  workflow_call:
    inputs:
      preset:
        description: "Preset to build for the analysis"
        type: string
        default: "default"
      apt-packages:
        description: "Extra apt packages, separated by spaces"
        type: string
        default: ""
      configure-args:
        description: "Extra arguments for cmake --preset, after the preset. Split at whitespace (no quoting)"
        type: string
        default: ""
      buildkit-repository:
        description: "Repository that provides buildkit"
        type: string
        default: "medaminben/buildkit"
      buildkit-ref:
        description: "Tag, branch or SHA of buildkit"
        type: string
        default: "v2.0.0"

defaults:
  run:
    shell: bash

jobs:
  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.buildkit-repository }}
          ref: ${{ inputs.buildkit-ref }}
          path: .buildkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install toolchain
        env:
          APT_PACKAGES: ${{ inputs.apt-packages }}
        run: |
          set -euo pipefail
          python3 -m pip install "cmake==3.31.*"
          read -r -a extra <<< "$APT_PACKAGES"
          sudo apt-get update
          sudo apt-get install -y ninja-build g++ "${extra[@]}"
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp
          build-mode: manual
      - name: Build for CodeQL
        env:
          PRESET: ${{ inputs.preset }}
          CONFIGURE_ARGS: ${{ inputs.configure-args }}
        run: |
          set -euo pipefail
          export BUILDKIT_DIR="$GITHUB_WORKSPACE/.buildkit"
          # Split at whitespace on purpose (no quoting).
          read -r -a preset_opts <<< "$CONFIGURE_ARGS"
          cmake --preset "$PRESET" "${preset_opts[@]}"
          cmake --build --preset "$PRESET" --parallel
      - uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"
