# Reusable release workflow for buildkit based products.
#
# The caller triggers it when a pull request is closed:
#   on:
#     pull_request:
#       types: [closed]
#   jobs:
#     release:
#       uses: medaminben/buildkit/.github/workflows/release.yml@v2.0.0
#       permissions:
#         contents: write
#         actions: write
#       with:
#         installer-workflow: windows-installer.yml   # optional
#
# installer-workflow is started with "gh workflow run <file> --ref <tag>", so
# that workflow must have "on: workflow_dispatch" in the caller's repository.
#
# The job runs only for a merged pull request into main or Beta. It takes the
# semver:* label of the PR (patch without a label, semver:none means no
# release), tags the merge commit, creates the GitHub release (a pre-release on
# Beta) with the commit subjects since the previous tag as notes and, when
# given, starts the installer workflow on the new tag. See
# tools/release/plan_release.py for the tag rules:
#   - Beta gets X.Y.Z-beta.N, N continuing the highest beta of the same X.Y.Z.
#   - main gets X.Y.Z. A merge of the Beta branch into main (promotion)
#     releases the base version of the highest beta tag reachable from the
#     merge commit that is greater than the latest stable. Without such a beta
#     the labels decide as usual. semver:none still means no release.
name: Release (reusable)

on:
  workflow_call:
    inputs:
      installer-workflow:
        description: "Workflow file of the caller to run with the new tag (needs workflow_dispatch)"
        type: string
        default: ""
      buildkit-repository:
        description: "Repository that provides tools/release"
        type: string
        default: "medaminben/buildkit"
      buildkit-ref:
        description: "Tag, branch or SHA of buildkit"
        type: string
        default: "v2.0.0"

permissions:
  contents: write
  actions: write

defaults:
  run:
    shell: bash

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      (github.event.pull_request.base.ref == 'main' || github.event.pull_request.base.ref == 'Beta')
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: ${{ inputs.buildkit-repository }}
          ref: ${{ inputs.buildkit-ref }}
          path: .buildkit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Plan the release
        id: plan
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          git fetch --tags --force
          tag="$(python3 -B -I .buildkit/tools/release/plan_release.py \
            --labels "$LABELS" --base "$BASE_REF" --head "$HEAD_REF" --sha "$SHA" \
            --notes-file "$RUNNER_TEMP/notes.md")"
          if [ -z "$tag" ]; then
            echo "::notice::No release for this pull request (semver:none)."
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Tag and publish the release
        if: steps.plan.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$SHA"
          git push origin "refs/tags/$TAG"
          args=(--notes-file "$RUNNER_TEMP/notes.md" --target "$SHA" --title "$TAG")
          if [ "$BASE_REF" = "Beta" ]; then args+=(--prerelease); fi
          gh release create "$TAG" "${args[@]}"
      - name: Run the installer workflow
        if: steps.plan.outputs.tag != '' && inputs.installer-workflow != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.plan.outputs.tag }}
          INSTALLER: ${{ inputs.installer-workflow }}
        run: gh workflow run "$INSTALLER" --ref "$TAG"
