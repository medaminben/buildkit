<!doctype html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} — {{site}}</title>
<meta name="description" content="{{summary}}">
{{icon}}
<link rel="stylesheet" href="../assets/manual.css">
</head>
<body>
<header class="top">
  <a class="brand" href="index.html">{{logo}}<span>{{site}}</span><small>{{manual}}</small></a>
  <nav class="langs" aria-label="{{language}}">{{switcher}}</nav>
</header>
<div class="layout">
  <nav class="sidebar" aria-label="{{contents}}">
    <h2>{{contents}}</h2>
    <ol>{{nav}}</ol>
  </nav>
  <main>
    <h1>{{title}}</h1>
    <p class="summary">{{summary}}</p>
    {{body}}
    <nav class="pager">{{prev}}{{next}}</nav>
  </main>
</div>
<div class="lightbox" hidden><img alt=""></div>
<script src="../assets/manual.js"></script>
</body>
</html>
